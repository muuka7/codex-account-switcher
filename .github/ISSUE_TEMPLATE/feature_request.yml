name: Feature request
description: Explain a problem and a proposed improvement.
body:
  - type: markdown
    attributes:
      value: Do not include credentials or private account information in this public request.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
