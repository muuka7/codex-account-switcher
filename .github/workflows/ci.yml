name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-cache
        id: node-cache
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm ci --prefix server --ignore-scripts
      - run: npm audit --prefix server --audit-level=moderate
      - name: Check shell scripts
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Save shared npm downloads from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.node-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.node-cache.outputs.cache-path }}
          key: ${{ steps.node-cache.outputs.cache-key }}

  package-smoke:
    name: Package smoke (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-cache
        id: node-cache
      - run: npm ci
      - name: Build ad-hoc macOS installers for validation
        if: runner.os == 'macOS'
        run: npm run pack:mac -- -c.mac.forceCodeSigning=false -c.mac.identity=- -c.mac.notarize=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build Windows installer for validation
        if: runner.os == 'Windows'
        run: npm run pack:win
      - name: Verify macOS artifacts and update metadata
        if: runner.os == 'macOS'
        run: npm run verify:release -- release mac --packaged
      - name: Verify Windows artifact
        if: runner.os == 'Windows'
        run: npm run verify:release -- release win --packaged
      - name: Save shared npm downloads from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.node-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.node-cache.outputs.cache-path }}
          key: ${{ steps.node-cache.outputs.cache-key }}
