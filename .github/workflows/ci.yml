name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm ci --prefix server --ignore-scripts
      - run: npm audit --prefix server --audit-level=moderate
      - name: Check shell scripts
        run: for script in scripts/*.sh; do bash -n "$script"; done

  package-smoke:
    name: Package smoke (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build ad-hoc macOS installers for validation
        if: runner.os == 'macOS'
        run: npm run pack:mac -- -c.mac.forceCodeSigning=false -c.mac.identity=- -c.mac.notarize=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build Windows installer for validation
        if: runner.os == 'Windows'
        run: npm run pack:win
      - name: Verify macOS artifacts and update metadata
        if: runner.os == 'macOS'
        run: npm run verify:release -- release mac --packaged
      - name: Verify Windows artifact
        if: runner.os == 'Windows'
        run: npm run verify:release -- release win --packaged
