name: Release

# The maintainer's Mac uploads signed/notarized assets before dispatching this
# workflow. No Apple credentials or self-hosted runner are needed on GitHub.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing draft/tag uploaded by npm run release:mac (e.g. v0.2.2)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      # Older release tags may predate the helper; load tooling from this workflow's commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-workflow
          sparse-checkout: .github/actions/setup-node-cache
          persist-credentials: false
      - uses: ./.release-workflow/.github/actions/setup-node-cache
      - run: npm ci
      - name: Download and validate the matching macOS draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --dir candidate
          node scripts/release-ci.js check-draft candidate
      - run: npm run lint
      - name: Run desktop behavioral tests
        run: node --test test/account-identity.test.js test/auto-updater.test.js test/bundle-runtime.test.js test/handoff-policy.test.js test/rate-limits.test.js test/release-artifacts.test.js test/release-pipeline.test.js test/state-events.test.js
      - run: npm audit --audit-level=moderate
      - run: npm run pack:win
      - run: npm run verify:release -- release win --packaged
      - name: Record and upload the verified Windows installer to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-ci.js record-windows release

  verify-macos:
    name: Verify macOS distribution
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-workflow
          sparse-checkout: .github/actions/setup-node-cache
          persist-credentials: false
      - uses: ./.release-workflow/.github/actions/setup-node-cache
      - run: npm ci --ignore-scripts
      - name: Verify draft receipts and downloaded update hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --dir candidate
          node scripts/release-ci.js check-draft candidate
      - name: Verify both ZIP and DMG app signatures, Apple team, stapling and Gatekeeper
        run: node scripts/verify-mac-signatures.js candidate
      - name: Record the exact macOS files independently verified by this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-ci.js record-macos candidate
    permissions:
      contents: write

  publish:
    name: Publish verified release
    needs: [windows, verify-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-workflow
          sparse-checkout: .github/actions/setup-node-cache
          persist-credentials: false
      - uses: ./.release-workflow/.github/actions/setup-node-cache
      - run: npm ci --ignore-scripts
      - name: Verify both platform receipts and produce checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --dir candidate
          node scripts/release-ci.js checksums candidate
          gh release upload "$RELEASE_TAG" candidate/SHA256SUMS.txt --clobber
      - name: Download again and verify the exact uploaded files before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --dir downloaded
          cmp candidate/SHA256SUMS.txt downloaded/SHA256SUMS.txt
          (cd downloaded && sha256sum --check SHA256SUMS.txt)
          node scripts/release-ci.js checksums downloaded
          cmp candidate/SHA256SUMS.txt downloaded/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest
