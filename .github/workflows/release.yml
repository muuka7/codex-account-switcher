name: Release

# A macOS DMG can only be produced on a macOS runner, so the two platforms are
# built in parallel and their artifacts are collected into a single release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (for example v0.1.0)'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            script: 'pack:mac'
            artifact: installers-macos
          - os: windows-latest
            label: Windows
            script: 'pack:win'
            artifact: installers-windows
    steps:
      - name: Check out ${{ inputs.tag || github.ref_name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm audit --audit-level=moderate

      - name: Run behavioral tests
        if: runner.os != 'Windows'
        run: npm test

      - name: Run desktop behavioral tests on Windows
        if: runner.os == 'Windows'
        run: node --test test/account-identity.test.js test/auto-updater.test.js test/handoff-policy.test.js test/rate-limits.test.js test/release-artifacts.test.js test/state-events.test.js

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) throw new Error('Tag and package version must match');"

      - name: Validate macOS signing credentials
        if: matrix.os == 'macos-latest'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test -n "$MAC_CSC_LINK" || { echo 'Missing MAC_CSC_LINK'; exit 1; }
          test -n "$MAC_CSC_KEY_PASSWORD" || { echo 'Missing MAC_CSC_KEY_PASSWORD'; exit 1; }
          test -n "$APPLE_API_KEY_BASE64" || { echo 'Missing APPLE_API_KEY_BASE64'; exit 1; }
          test -n "$APPLE_API_KEY_ID" || { echo 'Missing APPLE_API_KEY_ID'; exit 1; }
          test -n "$APPLE_API_ISSUER" || { echo 'Missing APPLE_API_ISSUER'; exit 1; }
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          {
            echo "APPLE_API_KEY=$key_path"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Package
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos-latest' && 'true' || '' }}
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || '' }}

      - name: Verify macOS signatures and notarization
        if: runner.os == 'macOS'
        run: |
          for app in release/mac*/'Codex Account Switcher.app'; do
            codesign --verify --deep --strict "$app"
            codesign --display --verbose=4 "$app" 2>&1 | grep -F 'Authority=Developer ID Application:'
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          done

      - name: Verify required macOS release files
        if: runner.os == 'macOS'
        run: npm run verify:release -- release mac --packaged

      - name: Verify required Windows release file
        if: runner.os == 'Windows'
        run: npm run verify:release -- release win --packaged

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.exe
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Verify combined release files
        run: npm run verify:release -- dist all

      - name: Checksum the installers
        working-directory: dist
        run: |
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Compose release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          Prebuilt installers for macOS and Windows. Both are produced by this
          repository's Release workflow from the tagged commit.

          | Download | Platform |
          | --- | --- |
          | `CodexAccountSwitcher-*-arm64.dmg` | macOS, Apple Silicon |
          | `CodexAccountSwitcher-*-x64.dmg` | macOS, Intel |
          | `CodexAccountSwitcher-*-arm64.zip` | macOS auto-update payload |
          | `CodexAccountSwitcher-*-x64.zip` | macOS auto-update payload |
          | `latest-mac.yml` | macOS auto-update metadata |
          | `CodexAccountSwitcher-Setup-*-x64.exe` | Windows 10/11, 64-bit |

          ## macOS distribution

          macOS installers are signed with Developer ID Application and notarized
          by Apple in the macOS build job. The app can check GitHub Releases for
          updates and download them from the signed ZIP artifact.

          **Windows** — SmartScreen may show "Windows protected your PC" until
          Windows code signing is configured. Choose **More info**, then **Run
          anyway**.

          Verify what you downloaded against `SHA256SUMS.txt` before installing.

          ## After installing

          Sign in to the official Codex app first, then follow **First use** in
          the README. Do not use Codex's own Logout action to add accounts —
          start from the switcher's **Add another account** instead.

          See `CHANGELOG.md` for what changed.
          NOTES

      - name: Upload a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "Codex Account Switcher $TAG" \
            --notes-file notes.md \
            --verify-tag --draft \
            dist/*.dmg dist/*.zip dist/*.yml dist/*.exe dist/SHA256SUMS.txt

      - name: Verify uploaded assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          verify_dir="$RUNNER_TEMP/verified-release"
          gh release download "$TAG" --dir "$verify_dir"
          (cd "$verify_dir" && sha256sum --check SHA256SUMS.txt)
          npm run verify:release -- "$verify_dir" all
          gh release edit "$TAG" --draft=false

      - name: Remove temporary Actions copies after verified publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[].id' |
          while read -r artifact_id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
